<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="murmur">
  <!--
    A murmur, drawn: three strokes falling away. The same mark the app wears
    beside its name, and the same shape its waveforms are made of.

    Nothing here but a flat ground and three rounded bars. The icon this
    replaced was the old app entire: a navy radial gradient, a blurred glow
    filter and a pale blue orb, every one of which the design rejected.

    The ground is the app's own #131211, which is also the manifest's
    background_color, so the icon and the splash screen are one surface.
  -->
  <rect width="512" height="512" fill="#131211"/>
  <g fill="#C9975C">
    <rect x="116" y="106" width="64" height="300" rx="32"/>
    <rect x="224" y="143" width="64" height="226" rx="32"/>
    <rect x="332" y="181" width="64" height="150" rx="32"/>
  </g>
</svg>
